name: Tests

on:
  push:  # every branch, so feature branches are tested before a pull request
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v  # the browser tests skip themselves here

  browser:
    # The page in headless Chromium. It loads its libraries, Pyodide and
    # queryearth from CDNs and PyPI, so it needs the network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run the browser tests
        run: python -m pytest -v tests/browser
