[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vizqueryearth"
version = "0.1.0"
description = "Draw the shapes of queryearth rules on a map in Jupyter."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Manish Venumuddula" }]
requires-python = ">=3.11"
dependencies = [
    "queryearth>=0.2,<0.3",
    "ipyleaflet>=0.19",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/CROCODILE-CESM/vizqueryearth"

[tool.setuptools.packages.find]
include = ["vizqueryearth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]
